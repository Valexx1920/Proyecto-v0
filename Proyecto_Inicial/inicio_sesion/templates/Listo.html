<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intercambio Completado</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4 text-center">

        <h2 class="mb-3">🎉 ¡Intercambio realizado con éxito!</h2>

        <p><strong>Objeto:</strong> {{ objeto.nombre }}</p>
        <p><strong>Gramos reciclados:</strong> {{ objeto.gramos }} g</p>

        <h3 class="mt-4">🌱 Puntos obtenidos:</h3>
        <h1 class="text-success fw-bold">
            {{ puntos|floatformat:0 }}
        </h1>

        <a href="/" class="btn btn-primary mt-4">Volver al inicio</a>
    </div>
</div>

</body>
</html>
